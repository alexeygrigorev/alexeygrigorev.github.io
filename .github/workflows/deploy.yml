name: Deploy site to Pages

env:
  RUSTKYLL_VERSION: v0.4.7
  RUSTKYLL_LINUX_AMD64_SHA256: bad6a752da9123c035aacd04992e1b45599f6889ef3d1a3b8472cf33ba552de0

on:
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rustkyll
        run: |
          mkdir -p .bin
          curl -fsSL \
            "https://github.com/alexeygrigorev/rustkyll/releases/download/${RUSTKYLL_VERSION}/rustkyll-linux-amd64" \
            -o .bin/rustkyll
          echo "${RUSTKYLL_LINUX_AMD64_SHA256}  .bin/rustkyll" | sha256sum -c -
          chmod +x .bin/rustkyll
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Rustkyll
        # Outputs to the './_site' directory by default
        run: .bin/rustkyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
